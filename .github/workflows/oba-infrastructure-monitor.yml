name: OBA Infrastructure Monitor

on:
  schedule:
    # GitHub scheduled runs are best-effort and may start late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oba-infrastructure-monitor
  cancel-in-progress: false

jobs:
  check-services:
    name: Check OBA Render services
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Downloader and Cobalt Engine
        env:
          DOWNLOADER_URL: https://oba-downloader.onrender.com/
          COBALT_ENGINE_URL: https://oba-cobalt-engine.onrender.com/
        run: |
          python - <<'PY'
          import os, sys, time, urllib.request, urllib.error

          targets = [
              ("OBA Downloader", os.environ["DOWNLOADER_URL"]),
              ("OBA Cobalt Engine", os.environ["COBALT_ENGINE_URL"]),
          ]

          failures = []
          print("OBA Infrastructure Monitor")
          print("An HTTP response confirms reachability, not full application correctness.")

          for name, url in targets:
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "OBA-Infrastructure-Monitor/1.0"},
                          method="GET",
                      )
                      started = time.time()
                      with urllib.request.urlopen(req, timeout=25) as response:
                          status = response.status
                          elapsed = round((time.time() - started) * 1000)
                          if 200 <= status < 400:
                              print(f"UP | {name} | HTTP {status} | {elapsed} ms | {url}")
                              last_error = None
                              break
                          last_error = f"HTTP {status}"
                  except urllib.error.HTTPError as exc:
                      last_error = f"HTTP {exc.code}"
                  except Exception as exc:
                      last_error = str(exc)
                  if attempt < 3:
                      time.sleep(5)

              if last_error:
                  print(f"DOWN/UNREACHABLE | {name} | {last_error} | {url}")
                  failures.append(f"{name}: {last_error}")

          if failures:
              print("\nFailures:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("\nBoth monitored services responded successfully.")
          PY
