name: Validate OBA research strategy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  research-strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check research strategy syntax
        run: node --check research-strategy.js
      - name: Run research strategy tests
        run: node tests/research-strategy.test.js
      - name: Check historical runner syntax
        run: node --check historical-data-backtest.js
      - name: Run historical data tests
        run: node tests/historical-data-backtest.test.js
      - name: Check strategy comparison syntax
        run: node --check strategy-comparison.js
      - name: Run strategy comparison tests
        run: node tests/strategy-comparison.test.js
